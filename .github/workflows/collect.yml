name: Collect live traffic speeds

on:
  schedule:
    - cron: "5 * * * *"   # every hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch TomTom flow data
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: python src/collect_tomtom.py
      - name: Commit new rows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add live/speeds.csv
          git diff --cached --quiet || git commit -m "data: live speeds $(date -u +%FT%H:%MZ)"
          git push
