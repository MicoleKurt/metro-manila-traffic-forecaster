name: Collect live traffic

on:
  schedule:
    - cron: "15 */6 * * *"   # every 6 hours (the feed holds the last 7 days)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas
      - name: Fetch TomTom live congestion (Metro Manila, Davao)
        run: python -m src.live_traffic
      - name: Commit new rows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add live/manila_hourly.csv
          git diff --cached --quiet || git commit -m "data: live congestion $(date -u +%FT%H:%MZ)"
          git push
